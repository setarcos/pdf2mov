# 讲稿文本文件 (内含 slides: page/text), 也可用 pdf2mov.py --trans 指定
trans: trans.yaml

# 音频目录 (TTS 脚本输出; pdf2mov.py 默认从这里读取音频)
# pdf2mov.py 可用 --audio-dir 覆盖
audio_dir: audio

# PDF 文件 (pdf2mov.py 用, 可用 --pdf 覆盖)
pdf: input.pdf

# 视频设置
video:
  resolution: (1280, 720)
  fps: 24
  output: output.mp4
  silent_padding: 0.5

voice:
  engine: xunfei
  format: wav

# 自定义词典: 讲稿发送给 TTS 前替换其中的词, 用于控制发音
# (区分大小写, 长词优先; 只影响合成, 不影响讲稿原文)
dictionary:
  UNO: woono
  INO: "I N O"

# engine: qwen 时, 模型路径等参数写在这里 (见 README)
qwen:
  model_custom:
  model_base:

xunfei:
  appid:
  apisec:
  apikey:
